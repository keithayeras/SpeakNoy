{% load static %}
<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login | SpeakNoy</title>
        <link rel="icon" type="image/x-icon" href="{% static 'flashcards/SpeakNoy.ico' %}">
        <link rel="stylesheet" href="{% static 'flashcards/style.css' %}">
        <script src="https://cdn.lordicon.com/lordicon.js"></script>
    </head>
    <body>
        <div class="auth-page">
            <div class="login-card">
                <div class="auth-brand">
                    <div class="brand-mark">
                        <lord-icon
                            src="https://cdn.lordicon.com/wwsllqpi.json"
                            trigger="hover"
                            colors="primary:#ffffff"
                            style="width:55px;height:55px">
                        </lord-icon>
                    </div>
                    <div>
                        <h1 style="margin: 0; color: var(--heading);">SpeakNoy</h1>
                        <p style="margin: 0; color: var(--text-soft);">A warmer way to learn Filipino dialects</p>
                    </div>
                </div>

                <div class="auth-intro">
                    <h2>Welcome back</h2>
                    <p>Log in to continue your flashcards, collections, and daily review progress.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <p class="auth-links">No account yet? <a href="/accounts/signup/">Create one here</a>.</p>
            </div>
        </div>
    </body>
</html>
